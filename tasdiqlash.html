<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Diplom/Sertifikatni tasdiqlash | Ziyomap</title>
<link rel="icon" type="image/png" href="icon-192x192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
:root {
    --primary: #2563eb; --card: #ffffff; --text: #1e293b; --muted: #64748b; --border: #e2e8f0;
    --page-bg: linear-gradient(160deg, #ede9fe 0%, #fce7f3 45%, #ffedd5 100%);
}
* { box-sizing: border-box; }
body {
    font-family: Inter, system-ui, sans-serif; margin: 0; min-height: 100dvh;
    background: var(--page-bg); color: var(--text); padding: 16px 16px 40px;
}
.wrap { max-width: 520px; margin: 40px auto 0; }
.brand { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--text); font-weight: 900; font-size: 1.15rem; margin-bottom: 24px; }
.brand img { height: 34px; width: 34px; object-fit: contain; }
.brand span.b { color: #00bcd4; }
.card {
    background: var(--card); border-radius: 20px; padding: 28px 24px; text-align: center;
    box-shadow: 0 12px 32px rgba(124,58,237,0.12);
}
.state-icon { font-size: 3rem; margin-bottom: 14px; }
.ok .state-icon { color: #059669; }
.fail .state-icon { color: #dc2626; }
h2 { margin: 0 0 8px; font-size: 1.25rem; }
.row { text-align: left; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
.row:last-child { border-bottom: none; }
.row b { color: var(--muted); font-weight: 600; display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
.muted { color: var(--muted); font-size: 0.85rem; margin-top: 16px; }
.seal { width: 124px; height: 124px; margin: -4px auto 4px; transform: rotate(-10deg); opacity: .95; }
.seal svg { width: 100%; height: 100%; display: block; }
.verified-pill {
    display: inline-flex; align-items: center; gap: 8px; background: #dcfce7; color: #166534;
    font-weight: 800; letter-spacing: 1.5px; font-size: 0.95rem; padding: 8px 18px; border-radius: 999px; margin: 6px 0 4px;
}
.issuer { color: var(--muted); font-size: 0.82rem; margin: 6px 0 14px; }
.name-big { font-size: 1.35rem; font-weight: 800; line-height: 1.25; padding: 14px 0 6px; border-top: 1px solid var(--border); }
.type-badge { display: inline-block; margin: 6px 0 10px; padding: 5px 14px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; color: #fff; }
.checked-at { color: var(--muted); font-size: 0.75rem; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
    <a href="index.html" class="brand"><img src="images/nav-icon.png" alt="Ziyomap"> <span>Ziyo<span class="b">map</span></span></a>
    <div class="card" id="result">
        <div class="state-icon"><i class="fas fa-spinner fa-spin"></i></div>
        <h2>Tekshirilmoqda...</h2>
    </div>
</div>

<script src="js/cert-stamp.js"></script>
<script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js';

const firebaseConfig = {
    apiKey: 'AIzaSyA2LiNy7o7l6kn1FTvOcXqBs14M3PVsjbI',
    authDomain: 'ziyomap.firebaseapp.com',
    projectId: 'ziyomap',
    storageBucket: 'ziyomap.firebasestorage.app',
    messagingSenderId: '982123868162',
    appId: '1:982123868162:web:6845723988c030fcd1f71b',
};

function esc(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
}

// Hujjat turini aniqlaydi: rangi (pechat va belgi uchun) va nomi
function describe(c) {
    const t = c.certType != null ? String(c.certType) : null;
    const rank = c.rank;
    if (t === '1' || (t == null && c.isWinner && rank === 1)) return { label: 'I darajali diplom', color: '#8a6512' };
    if (t === '2' || (t == null && c.isWinner && rank === 2)) return { label: 'II darajali diplom', color: '#526071' };
    if (t === '3' || (t == null && c.isWinner && rank === 3)) return { label: 'III darajali diplom', color: '#87491c' };
    if (t === '4') return { label: 'Rag\u2018batlantirish sertifikati', color: '#166534', reason: c.reason || '' };
    if (t === '5') return { label: 'Tashakkurnoma', color: '#5b21b6', childName: c.childName || '' };
    if (t == null && c.isWinner) return { label: (rank != null ? rank + '-o\u2018rin diplomi' : 'Diplom'), color: '#5b21b6' };
    return { label: 'Ishtirok sertifikati', color: '#1e40af' };
}

async function verify() {
    const resultEl = document.getElementById('result');
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (!id) {
        resultEl.className = 'card fail';
        resultEl.innerHTML = '<div class="state-icon"><i class="fas fa-circle-question"></i></div><h2>Kod topilmadi</h2><p class="muted">Havolada tasdiqlash kodi yo\u2018q.</p>';
        return;
    }
    try {
        const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const snap = await getDoc(doc(db, 'certificates', id));
        if (!snap.exists()) {
            resultEl.className = 'card fail';
            resultEl.innerHTML = '<div class="state-icon"><i class="fas fa-triangle-exclamation"></i></div><h2>Hujjat topilmadi</h2><p class="muted">Bu kod bo\u2018yicha hech qanday diplom/sertifikat ro\u2018yxatda yo\u2018q. Hujjat soxta bo\u2018lishi mumkin.</p>';
            return;
        }
        const c = snap.data();
        if (c.revoked) {
            // Bekor qilingan hujjat: haqiqiy deb ko'rsatilmaydi
            resultEl.className = 'card fail';
            resultEl.innerHTML = `
                <div class="state-icon"><i class="fas fa-ban"></i></div>
                <h2>Hujjat bekor qilingan</h2>
                <p class="muted" style="margin-top:8px">${esc(c.fullName || '')} nomiga berilgan <b>${esc(id)}</b> raqamli hujjat bekor qilingan va haqiqiy hisoblanmaydi.</p>
                ${c.revokedReason ? `<div class="row"><b>Sabab</b>${esc(c.revokedReason)}</div>` : ''}
                <p class="muted">Savollar bo\u2018lsa, Ziyomap jamoasiga murojaat qiling.</p>`;
            return;
        }
        const info = describe(c);
        const stamp = window.ZiyomapStamp
            ? '<div class="seal">' + window.ZiyomapStamp.svg({ color: info.color, year: window.ZiyomapStamp.yearFrom(c.issuedDateText), style: c.stampStyle }) + '</div>'
            : '<div class="state-icon"><i class="fas fa-circle-check"></i></div>';
        const now = new Date();
        const MONTHS = ['yanvar', 'fevral', 'mart', 'aprel', 'may', 'iyun', 'iyul', 'avgust', 'sentabr', 'oktabr', 'noyabr', 'dekabr'];
        const pad = (n) => String(n).padStart(2, '0');
        const checkedAt = `${now.getDate()}-${MONTHS[now.getMonth()]} ${now.getFullYear()}, ${pad(now.getHours())}:${pad(now.getMinutes())}`;
        resultEl.className = 'card ok';
        resultEl.innerHTML = `
            ${stamp}
            <div class="verified-pill"><i class="fas fa-circle-check"></i> HUJJAT HAQIQIY</div>
            <p class="issuer">Ziyomap platformasi tomonidan berilgan va tizimda ro\u2018yxatdan o\u2018tgan</p>
            <div class="name-big">${esc(c.fullName)}</div>
            <span class="type-badge" style="background:${info.color}">${esc(info.label)}</span>
            ${c.contestTitle ? `<div class="row"><b>Tanlov</b>${esc(c.contestTitle)}</div>` : ''}
            ${info.childName ? `<div class="row"><b>Farzandi</b>${esc(info.childName)}</div>` : ''}
            ${info.reason ? `<div class="row"><b>Sabab</b>${esc(info.reason)}</div>` : ''}
            ${c.score != null && c.score !== '' ? `<div class="row"><b>Umumiy ball</b>${esc(c.score)}</div>` : ''}
            <div class="row"><b>Berilgan sana</b>${esc(c.issuedDateText || '')}</div>
            <div class="row"><b>Hujjat raqami</b>${esc(id)}</div>
            <p class="checked-at"><i class="fas fa-clock"></i> Tekshirilgan vaqt: ${esc(checkedAt)}</p>
        `;
    } catch (err) {
        console.error(err);
        resultEl.className = 'card fail';
        resultEl.innerHTML = '<div class="state-icon"><i class="fas fa-xmark"></i></div><h2>Xatolik yuz berdi</h2><p class="muted">Qayta urinib ko\u2018ring.</p>';
    }
}
verify();
</script>
</body>
</html>
