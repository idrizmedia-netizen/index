<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Maqola yozish — Admin | Ziyomap</title>
<link rel="icon" type="image/png" href="icon-192x192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="css/blog.css">
<style>
.wrap{max-width:1100px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.green{background:#059669;border-color:#059669;color:#fff}
.btn.danger{color:#dc2626}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
.notice{padding:11px 14px;border-radius:12px;font-size:14px;margin-bottom:14px;line-height:1.5}
.notice.ok{background:rgba(5,150,105,.12);border:1px solid rgba(5,150,105,.4)}
.notice.warn{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.5)}
.notice.err{background:rgba(220,38,38,.12);border:1px solid rgba(220,38,38,.45)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:200px}
label.f{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}
.f-in{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--text);font:inherit}
textarea.f-in{min-height:340px;resize:vertical;line-height:1.6;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.tb{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tb button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;min-width:36px;height:34px;cursor:pointer;font-weight:800}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.preview{border:1px dashed var(--border);border-radius:12px;padding:14px 18px;min-height:340px;max-height:560px;overflow:auto}
.cover-box{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.cover-box img{width:200px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--border);background:#e2e8f0}
.hint{color:var(--muted);font-size:12px;margin-top:4px}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.item:last-child{border-bottom:none}
.item img{width:72px;height:48px;object-fit:cover;border-radius:8px;background:#e2e8f0}
.item .t{flex:1;min-width:200px}
.item .t b{display:block;font-size:15px}
.item .t small{color:var(--muted)}
.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
.badge.pub{background:rgba(5,150,105,.15);color:#059669}
.badge.dr{background:rgba(245,158,11,.18);color:#b45309}
.badge.tg{background:rgba(14,165,233,.15);color:#0284c7}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.chk{display:flex;gap:10px;align-items:center;margin:16px 0 4px;font-weight:700}
.sticky{position:sticky;bottom:0;background:var(--card);padding:12px 0 4px;margin-top:16px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap}
#deny{display:none;text-align:center;padding:60px 10px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row">
    <a class="back" href="admin.html"><i class="fa-solid fa-arrow-left"></i> Admin panel</a>
    <strong>✍️ Maqola yozish</strong>
    <button class="icon-btn" id="theme-btn" title="Tun/Kun"><i class="fas fa-moon"></i></button>
  </div>

  <div id="deny" class="panel">
    <h2>Ruxsat yo'q</h2>
    <p class="sub">Bu sahifa faqat adminlar uchun. Admin hisobingiz bilan tizimga kiring.</p>
    <a class="btn primary" href="kirish.html?return=admin-maqola.html">Kirish</a>
  </div>

  <div id="app" class="hidden">
    <div id="tg-status" class="notice warn">Telegram sozlamalari tekshirilmoqda...</div>
    <div id="msg"></div>

    <!-- Ro'yxat -->
    <div id="view-list">
      <div class="bar">
        <h2 style="margin:0">Maqolalar</h2>
        <button class="btn primary" id="btn-new"><i class="fa-solid fa-plus"></i> Yangi maqola</button>
      </div>
      <div class="panel" id="list-box">Yuklanmoqda...</div>
    </div>

    <!-- Muharrir -->
    <div id="view-edit" class="hidden">
      <div class="bar">
        <h2 style="margin:0" id="edit-title">Yangi maqola</h2>
        <button class="btn" id="btn-back"><i class="fa-solid fa-list"></i> Ro'yxatga qaytish</button>
      </div>
      <div class="panel">
        <label class="f" for="f-title">Sarlavha *</label>
        <input class="f-in" id="f-title" maxlength="150" placeholder="Maqola sarlavhasi">

        <div class="row">
          <div>
            <label class="f" for="f-cat">Kategoriya</label>
            <input class="f-in" id="f-cat" list="cats" maxlength="40" placeholder="Masalan: Fizika">
            <datalist id="cats"></datalist>
          </div>
          <div>
            <label class="f" for="f-link">Tashqi havola (ixtiyoriy)</label>
            <input class="f-in" id="f-link" placeholder="https://t.me/... (matn bo'sh bo'lsa, kartochka shu havolaga olib boradi)">
          </div>
        </div>

        <label class="f" for="f-excerpt">Qisqa ta'rif <span class="hint" id="ex-count"></span></label>
        <textarea class="f-in" id="f-excerpt" style="min-height:70px;font-family:inherit" maxlength="300" placeholder="Kartochka va Telegram uchun 1–2 gap. Bo'sh qolsa, matndan olinadi."></textarea>

        <label class="f">Muqova rasmi</label>
        <div class="cover-box">
          <img id="cover-prev" alt="" class="hidden">
          <div style="flex:1;min-width:220px">
            <input type="file" id="f-file" accept="image/png,image/jpeg,image/webp">
            <div class="hint">Rasm avtomatik kichraytiriladi (≈1000px). Yoki rasm havolasini kiriting:</div>
            <input class="f-in" id="f-cover" placeholder="https://... (ixtiyoriy)" style="margin-top:6px">
            <button class="btn sm danger" id="btn-cover-clear" type="button" style="margin-top:8px">Rasmni olib tashlash</button>
          </div>
        </div>

        <label class="f">Matn *</label>
        <div class="tb" id="toolbar">
          <button type="button" data-a="b" title="Qalin"><b>B</b></button>
          <button type="button" data-a="i" title="Kursiv"><i>I</i></button>
          <button type="button" data-a="h2" title="Sarlavha">H2</button>
          <button type="button" data-a="h3" title="Kichik sarlavha">H3</button>
          <button type="button" data-a="ul" title="Ro'yxat">• Ro'yxat</button>
          <button type="button" data-a="ol" title="Raqamli ro'yxat">1. Ro'yxat</button>
          <button type="button" data-a="q" title="Iqtibos">❝</button>
          <button type="button" data-a="link" title="Havola"><i class="fa-solid fa-link"></i></button>
          <button type="button" data-a="img" title="Rasm (havola orqali)"><i class="fa-regular fa-image"></i></button>
          <button type="button" data-a="hr" title="Chiziq">—</button>
        </div>
        <div class="split">
          <textarea class="f-in" id="f-body" placeholder="Maqolani shu yerda yozing. Yangi abzats uchun bo'sh qator qoldiring.&#10;&#10;## Sarlavha&#10;**qalin**, *kursiv*, [havola](https://...)"></textarea>
          <div class="preview"><div class="av-body" id="prev"></div></div>
        </div>
        <div class="hint" id="body-count"></div>

        <label class="chk"><input type="checkbox" id="f-tg" checked> Nashr qilinganda Telegram kanalga avtomatik yuborilsin</label>
        <div class="hint" id="tg-note"></div>

        <div class="sticky">
          <button class="btn" id="btn-draft"><i class="fa-regular fa-floppy-disk"></i> Qoralama saqlash</button>
          <button class="btn green" id="btn-publish"><i class="fa-solid fa-paper-plane"></i> <span id="pub-label">Nashr qilish</span></button>
          <button class="btn hidden" id="btn-resend"><i class="fa-brands fa-telegram"></i> Telegramga yuborish</button>
          <button class="btn danger hidden" id="btn-unpub"><i class="fa-solid fa-eye-slash"></i> Qoralamaga qaytarish</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/ziyomap-usage.js"></script>
<script src="js/admin-guard.js"></script>
<script src="js/api-auth.js"></script>
<script src="js/md-lite.js"></script>
<script type="module" src="js/admin-maqola.js"></script>
</body>
</html>
