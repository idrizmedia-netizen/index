<head>
<meta charset="UTF-8">

<meta property="og:title" content="Maqolalar | Ziyomap">
<meta property="og:description" content="Ziyomap'dagi ilmiy maqolalar, ta'lim yangiliklari va foydali materiallar.">

<meta property="og:url" content="https://www.ziyomap.uz/maqolalar.html">

</head>
<body>
<div class="wrap">
  <div class="top-row">
    <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Bosh sahifa</a>
    <button class="icon-btn" id="theme-btn" title="Tun/Kun"><i class="fas fa-moon"></i></button>
  </div>
  <h1 class="page-title">Ilmiy maqolalar va yangiliklar</h1>
  <p class="sub">Fizika, kimyo, biologiya va ta'lim bo'yicha foydali materiallar.</p>
  <div class="tools"><input id="article-search" type="search" placeholder="Maqola qidirish..."></div>
  <div id="article-cats"></div>
  <div id="articles-list"><p class="al-empty">Yuklanmoqda...</p></div>
</div>
<script src="js/md-lite.js"></script>
<script type="module" src="js/blog.js"></script>
<script>
(function () {
    function apply(isDark) {
        document.body.classList.toggle('dark-theme', isDark);
        var i = document.querySelector('#theme-btn i');
        if (i) { i.classList.toggle('fa-sun', isDark); i.classList.toggle('fa-moon', !isDark); }
    }
    apply(localStorage.getItem('theme') === 'dark');
    document.getElementById('theme-btn').addEventListener('click', function () {
        var d = !document.body.classList.contains('dark-theme');
        apply(d); localStorage.setItem('theme', d ? 'dark' : 'light');
    });
})();
</script>
</body>
</html>
